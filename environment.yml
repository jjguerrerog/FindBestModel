# micromamba create -f environment.yml
# Mirrors requirements.txt, using conda-forge builds.
name: findbestmodel
channels:
  - conda-forge
dependencies:
  - python=3.12
  # Core
  - numpy>=2.0
  - libblas=*=*openblas  # MKL crashes worker processes when the env is not activated (e.g. a VS Code kernel)
  - pandas>=2.2
  - scipy>=1.13
  - pyarrow>=15.0
  - requests>=2.31
  # AORC basin rainfall (cloud Zarr store on AWS)
  - s3fs>=2024.2
  - xarray>=2024.2
  - zarr>=2.17
  - shapely>=2.0
  # compare_models.ipynb
  - matplotlib>=3.8
  - plotly>=5.20
  - nbformat>=5.9
  - jinja2>=3.1          # needed by pandas DataFrame.style (Styler)
  - ipykernel>=6.29
